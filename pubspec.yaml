name: expensetracker
description: "Travel Expenses Manager — minimal, fast, offline travel expense tracking."
publish_to: 'none'
version: 1.1.0+5

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State
  flutter_riverpod: ^3.0.0

  # Offline storage
  hive_ce: ^2.11.0
  path_provider: ^2.1.5

  # Charts & formatting
  fl_chart: ^1.0.0
  intl: ^0.20.2

  # Receipts, export, sharing
  image_picker: ^1.1.2
  pdf: ^3.11.1
  share_plus: ^11.0.0
  file_picker: ^10.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
